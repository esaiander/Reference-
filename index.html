<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SELN Picker Wheel</title>
<style>
  :root {
    --bg-1: #0b1437;
    --bg-2: #1a237e;
    --accent: #ffd54a;
    --accent-2: #ff5252;
    --text: #ffffff;
    --muted: #c9d1ff;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 60%, #050818 100%);
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 24px 32px;
    gap: 16px;
  }

  header {
    text-align: center;
    position: relative;
  }

  .nav-link {
    position: absolute;
    top: 6px;
    right: 0;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--card);
  }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,0.12); }

  h1 {
    margin: 0;
    font-size: clamp(28px, 3.4vw, 48px);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
  }

  h1 .accent { color: var(--accent); }

  .subtitle {
    margin-top: 6px;
    font-size: clamp(14px, 1.3vw, 18px);
    color: var(--muted);
    font-weight: 500;
  }

  main {
    display: grid;
    grid-template-columns: minmax(320px, 1.4fr) minmax(260px, 1fr);
    gap: 32px;
    align-items: center;
    min-height: 0;
  }

  .wheel-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-height: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
  }

  .pointer {
    position: absolute;
    top: 50%;
    right: -18px;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 26px solid transparent;
    border-bottom: 26px solid transparent;
    border-right: 44px solid var(--accent);
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
    z-index: 2;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 14%;
    height: 14%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #d6d9e6 60%, #8b91ad 100%);
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 -4px 10px rgba(0, 0, 0, 0.2);
    z-index: 1;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 24px;
    backdrop-filter: blur(8px);
  }

  .result-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-weight: 600;
  }

  .result-value {
    margin-top: 6px;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
    min-height: 1.1em;
    word-break: break-word;
  }

  .result-value.placeholder {
    color: var(--muted);
    font-weight: 600;
    font-size: clamp(20px, 2.4vw, 32px);
  }

  .stats {
    display: flex;
    gap: 12px;
  }

  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
  }

  .stat .num {
    font-size: clamp(22px, 2.6vw, 32px);
    font-weight: 800;
    color: var(--accent);
  }

  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .add-row {
    display: flex;
    gap: 8px;
  }

  .add-row input {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .add-row input::placeholder { color: rgba(255, 255, 255, 0.45); }

  .add-row input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.12);
  }

  .add-row button {
    flex: 0 0 auto;
    min-width: 90px;
    padding: 14px 18px;
    font-size: 16px;
    background: linear-gradient(180deg, #6cd3ff, #2196f3);
    color: #06122a;
    box-shadow: 0 8px 22px rgba(33, 150, 243, 0.3), inset 0 -3px 0 rgba(0,0,0,0.15);
  }

  .error {
    color: #ffb3b3;
    font-size: 13px;
    min-height: 1em;
    margin-top: -6px;
  }

  button {
    flex: 1;
    min-width: 130px;
    padding: 16px 22px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    color: #1a1a1a;
  }

  button.spin {
    background: linear-gradient(180deg, #ffe97a, #ffc220);
    color: #1a1530;
    box-shadow: 0 8px 22px rgba(255, 200, 60, 0.35), inset 0 -3px 0 rgba(0,0,0,0.12);
  }

  button.reset {
    background: linear-gradient(180deg, #ff8585, #ff3d3d);
    color: #ffffff;
    box-shadow: 0 8px 22px rgba(255, 80, 80, 0.35), inset 0 -3px 0 rgba(0,0,0,0.18);
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.05);
  }

  button:active:not(:disabled) { transform: translateY(1px); }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .remaining {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    max-height: 32vh;
    overflow-y: auto;
  }

  .remaining h3 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .chip.picked {
    background: rgba(255, 82, 82, 0.18);
    border-color: rgba(255, 82, 82, 0.5);
    color: #ffb3b3;
    text-decoration: line-through;
  }

  .chip button.chip-btn {
    flex: 0 0 auto;
    min-width: 0;
    padding: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    box-shadow: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .chip button.chip-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.32);
    transform: none;
    filter: none;
  }

  .chip.picked button.chip-btn {
    background: rgba(110, 231, 183, 0.35);
    color: #d1fae5;
  }

  .chip.picked button.chip-btn:hover:not(:disabled) {
    background: rgba(110, 231, 183, 0.55);
  }

  .timer-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .timer-card.warn { border-color: rgba(255, 82, 82, 0.55); }
  .timer-card.done {
    animation: flashRed 0.6s ease 3;
  }

  .timer-display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 4.6vw, 56px);
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 1px;
    line-height: 1;
  }

  .timer-display.warn { color: #ff8585; }

  .timer-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    min-width: 130px;
  }

  .timer-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: 600;
  }

  .timer-input-row input {
    width: 70px;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    text-align: center;
    outline: none;
  }

  .timer-input-row input:focus { border-color: var(--accent); }

  .timer-controls {
    display: flex;
    gap: 6px;
  }

  .timer-controls button {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-radius: 10px;
    box-shadow: none;
  }

  .timer-controls button:hover:not(:disabled) {
    background: rgba(255,255,255,0.22);
    transform: none;
    filter: none;
  }

  @keyframes flashRed {
    0%, 100% { background: var(--card); }
    50% { background: rgba(255, 82, 82, 0.32); }
  }

  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-value.pop { animation: pop 0.55s cubic-bezier(.2,1.4,.4,1); }

  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }

  .confetti span {
    position: absolute;
    width: 10px;
    height: 14px;
    top: -20px;
    border-radius: 2px;
    will-change: transform, opacity;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(720deg); opacity: 0.9; }
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    opacity: 0.8;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .app { padding: 16px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>SELN <span class="accent">Picker Wheel</span></h1>
      <div class="subtitle">Spin to select a state — picked states are removed automatically</div>
      <a class="nav-link" href="map.html">Map version &rarr;</a>
    </header>

    <main>
      <div class="wheel-wrap">
        <canvas id="wheel" width="800" height="800" aria-label="Picker wheel"></canvas>
        <div class="hub" aria-hidden="true"></div>
        <div class="pointer" aria-hidden="true"></div>
      </div>

      <section class="panel">
        <div class="result-card">
          <div class="result-label">Selected</div>
          <div id="result" class="result-value placeholder">Press Spin to begin</div>
        </div>

        <div class="stats">
          <div class="stat">
            <div id="remainingCount" class="num">0</div>
            <div class="label">Remaining</div>
          </div>
          <div class="stat">
            <div id="pickedCount" class="num">0</div>
            <div class="label">Picked</div>
          </div>
        </div>

        <div id="timerCard" class="timer-card">
          <div id="timerDisplay" class="timer-display">0:30</div>
          <div class="timer-side">
            <label class="timer-input-row">
              <span>Sec</span>
              <input id="timerInput" type="number" min="1" max="3600" value="30" />
            </label>
            <div class="timer-controls">
              <button id="timerStart" type="button">Start</button>
              <button id="timerPause" type="button">Pause</button>
              <button id="timerReset" type="button">Reset</button>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button id="spin" class="spin" type="button">Spin</button>
          <button id="reset" class="reset" type="button">Reset</button>
        </div>

        <form id="addForm" class="add-row" autocomplete="off">
          <input id="addInput" type="text" placeholder="Add a state…" maxlength="40" />
          <button id="addBtn" type="submit">Add</button>
        </form>
        <div id="addError" class="error" role="alert" aria-live="polite"></div>

        <div class="remaining">
          <h3>States</h3>
          <div id="chips" class="chips"></div>
        </div>
      </section>
    </main>

    <footer>Tip: Use full-screen + Zoom &ldquo;Share Screen&rdquo; for the best look.</footer>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

<script>
(() => {
  const SELN_STATES = [
    'Alabama', 'Alaska', 'Arizona', 'Connecticut', 'Delaware',
    'Georgia', 'Hawaii', 'Indiana', 'Kansas', 'Louisiana',
    'Maryland', 'Massachusetts', 'Michigan', 'Minnesota', 'Missouri',
    'New Jersey', 'New Mexico', 'New York', 'North Carolina', 'Ohio',
    'Oklahoma', 'Oregon', 'Rhode Island', 'South Dakota', 'Texas',
    'Utah', 'Virginia', 'Washington'
  ];

  const PALETTE = [
    '#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#8338ec',
    '#fb5607', '#3a86ff', '#ff006e', '#43aa8b', '#f4a261',
    '#9d4edd', '#2a9d8f', '#e76f51', '#4cc9f0', '#f72585'
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const resultEl = document.getElementById('result');
  const remainingCountEl = document.getElementById('remainingCount');
  const pickedCountEl = document.getElementById('pickedCount');
  const chipsEl = document.getElementById('chips');
  const spinBtn = document.getElementById('spin');
  const resetBtn = document.getElementById('reset');
  const addForm = document.getElementById('addForm');
  const addInput = document.getElementById('addInput');
  const addError = document.getElementById('addError');
  const timerCard = document.getElementById('timerCard');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerInput = document.getElementById('timerInput');
  const timerStartBtn = document.getElementById('timerStart');
  const timerPauseBtn = document.getElementById('timerPause');
  const timerResetBtn = document.getElementById('timerReset');
  const confettiEl = document.getElementById('confetti');

  let allStates = [...SELN_STATES];
  let remaining = [...SELN_STATES];
  let picked = [];
  let rotation = 0;
  let spinning = false;
  let winnerLabel = null;
  let winnerGlow = 0;
  let winnerGlowRAF = null;

  let timerSeconds = 30;
  let timerRemaining = 30;
  let timerEndAt = null;
  let timerInterval = null;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const size = Math.floor(Math.min(rect.width, rect.height));
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawWheel();
  }

  function colorFor(label) {
    const idx = allStates.indexOf(label);
    return PALETTE[(idx >= 0 ? idx : 0) % PALETTE.length];
  }

  function drawWheel() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const cx = w / 2;
    const cy = h / 2;
    const radius = Math.min(w, h) / 2 - 8;

    ctx.clearRect(0, 0, w, h);

    if (remaining.length === 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#2a2f55';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.floor(radius * 0.12)}px Segoe UI, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('All states picked!', cx, cy - radius * 0.05);
      ctx.font = `${Math.floor(radius * 0.07)}px Segoe UI, sans-serif`;
      ctx.fillStyle = '#c9d1ff';
      ctx.fillText('Press Reset to start over', cx, cy + radius * 0.1);
      return;
    }

    const n = remaining.length;
    const arc = (Math.PI * 2) / n;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    const winnerIdx = winnerLabel ? remaining.indexOf(winnerLabel) : -1;

    for (let i = 0; i < n; i++) {
      const start = i * arc;
      const end = start + arc;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = colorFor(remaining[i]);
      ctx.fill();

      if (i === winnerIdx && winnerGlow > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = winnerGlow * 0.6;
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }

      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.stroke();

      if (i === winnerIdx && winnerGlow > 0) {
        ctx.save();
        ctx.lineWidth = 6 + winnerGlow * 6;
        ctx.strokeStyle = `rgba(255, 213, 74, ${0.5 + winnerGlow * 0.5})`;
        ctx.shadowColor = '#ffd54a';
        ctx.shadowBlur = 24 * winnerGlow;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const fontSize = Math.max(12, Math.min(28, Math.floor(radius / Math.max(n, 8) * 1.6)));
    ctx.font = `700 ${fontSize}px Segoe UI, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;

    for (let i = 0; i < n; i++) {
      const angle = i * arc + arc / 2;
      ctx.save();
      ctx.rotate(angle);
      ctx.fillText(remaining[i], radius - 18, 0);
      ctx.restore();
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function renderPanel() {
    remainingCountEl.textContent = remaining.length;
    pickedCountEl.textContent = picked.length;

    chipsEl.innerHTML = '';
    allStates.forEach(s => {
      const isPicked = picked.includes(s);
      const span = document.createElement('span');
      span.className = 'chip' + (isPicked ? ' picked' : '');

      const text = document.createElement('span');
      text.textContent = s;
      span.appendChild(text);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip-btn';
      btn.disabled = spinning;
      if (isPicked) {
        btn.textContent = '↺';
        btn.title = `Put ${s} back on the wheel`;
        btn.setAttribute('aria-label', `Put ${s} back on the wheel`);
        btn.addEventListener('click', () => readdState(s));
      } else {
        btn.textContent = '×';
        btn.title = `Remove ${s} from the wheel`;
        btn.setAttribute('aria-label', `Remove ${s} from the wheel`);
        btn.addEventListener('click', () => removeState(s));
      }
      span.appendChild(btn);

      chipsEl.appendChild(span);
    });

    spinBtn.disabled = spinning || remaining.length === 0;
    const isPristine = picked.length === 0 && allStates.length === SELN_STATES.length
      && SELN_STATES.every(s => allStates.includes(s));
    resetBtn.disabled = spinning || isPristine;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function spin() {
    if (spinning || remaining.length === 0) return;
    spinning = true;
    winnerLabel = null;
    winnerGlow = 0;
    if (winnerGlowRAF) cancelAnimationFrame(winnerGlowRAF);
    renderPanel();

    const n = remaining.length;
    const arc = (Math.PI * 2) / n;
    const targetIndex = Math.floor(Math.random() * n);

    const targetCenter = targetIndex * arc + arc / 2;
    const turns = 5 + Math.random() * 2;
    const finalRotation = (Math.PI * 2) * turns - targetCenter;

    const startRotation = rotation % (Math.PI * 2);
    const delta = finalRotation - startRotation;
    const duration = 4200 + Math.random() * 800;
    const startTime = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      rotation = startRotation + delta * easeOutCubic(t);
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        finishSpin(targetIndex);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(index) {
    const winner = remaining[index];
    resultEl.textContent = winner;
    resultEl.classList.remove('placeholder');
    resultEl.classList.remove('pop');
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');

    winnerLabel = winner;
    rotation = rotation % (Math.PI * 2);
    spinning = false;

    runWinnerGlow(() => {
      const idx = remaining.indexOf(winner);
      if (idx >= 0) {
        picked.push(winner);
        remaining.splice(idx, 1);
      }
      winnerLabel = null;
      drawWheel();
      renderPanel();
      startTimerCountdown();
    });

    launchConfetti();
    drawWheel();
    renderPanel();
  }

  function runWinnerGlow(onDone) {
    const duration = 1500;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const pulse = Math.sin(t * Math.PI * 4) * 0.5 + 0.5;
      winnerGlow = (1 - t) * (0.5 + pulse * 0.5);
      drawWheel();
      if (t < 1) {
        winnerGlowRAF = requestAnimationFrame(step);
      } else {
        winnerGlow = 0;
        winnerGlowRAF = null;
        if (onDone) onDone();
      }
    }
    winnerGlowRAF = requestAnimationFrame(step);
  }

  function launchConfetti() {
    const colors = PALETTE;
    const count = 90;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      const left = Math.random() * 100;
      const dx = (Math.random() - 0.5) * 240;
      const dur = 2.4 + Math.random() * 1.6;
      const delay = Math.random() * 0.4;
      piece.style.left = left + 'vw';
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty('--dx', dx + 'px');
      piece.style.animationDuration = dur + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.width = (6 + Math.random() * 8) + 'px';
      piece.style.height = (10 + Math.random() * 10) + 'px';
      piece.addEventListener('animationend', () => piece.remove());
      frag.appendChild(piece);
    }
    confettiEl.appendChild(frag);
  }

  function removeState(name) {
    if (spinning) return;
    const i = remaining.indexOf(name);
    if (i >= 0) remaining.splice(i, 1);
    const j = allStates.indexOf(name);
    if (j >= 0) allStates.splice(j, 1);
    drawWheel();
    renderPanel();
  }

  function readdState(name) {
    if (spinning) return;
    const i = picked.indexOf(name);
    if (i >= 0) picked.splice(i, 1);
    if (!remaining.includes(name)) remaining.push(name);
    if (!allStates.includes(name)) allStates.push(name);
    drawWheel();
    renderPanel();
  }

  function reset() {
    if (spinning) return;
    allStates = [...SELN_STATES];
    remaining = [...SELN_STATES];
    picked = [];
    rotation = 0;
    winnerLabel = null;
    winnerGlow = 0;
    if (winnerGlowRAF) { cancelAnimationFrame(winnerGlowRAF); winnerGlowRAF = null; }
    resultEl.textContent = 'Press Spin to begin';
    resultEl.classList.add('placeholder');
    resultEl.classList.remove('pop');
    addError.textContent = '';
    resetTimer();
    drawWheel();
    renderPanel();
  }

  function formatTime(s) {
    s = Math.max(0, Math.ceil(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function renderTimer() {
    timerDisplay.textContent = formatTime(timerRemaining);
    const warn = timerRemaining <= 5 && timerRemaining > 0 && timerEndAt;
    timerDisplay.classList.toggle('warn', !!warn);
    timerCard.classList.toggle('warn', !!warn);
  }

  function readTimerInput() {
    const v = parseInt(timerInput.value, 10);
    return (Number.isFinite(v) && v > 0) ? Math.min(v, 3600) : 30;
  }

  function startTimer() {
    if (timerInterval) return;
    if (timerRemaining <= 0) timerRemaining = readTimerInput();
    timerEndAt = performance.now() + timerRemaining * 1000;
    timerCard.classList.remove('done');
    timerInterval = setInterval(() => {
      timerRemaining = (timerEndAt - performance.now()) / 1000;
      if (timerRemaining <= 0) {
        timerRemaining = 0;
        renderTimer();
        stopTimer();
        timerCard.classList.add('done');
        playBeep();
      } else {
        renderTimer();
      }
    }, 100);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerEndAt = null;
  }

  function pauseTimer() { stopTimer(); renderTimer(); }

  function resetTimer() {
    stopTimer();
    timerSeconds = readTimerInput();
    timerRemaining = timerSeconds;
    timerCard.classList.remove('done');
    renderTimer();
  }

  function startTimerCountdown() {
    timerSeconds = readTimerInput();
    timerRemaining = timerSeconds;
    timerCard.classList.remove('done');
    renderTimer();
    startTimer();
  }

  function playBeep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ac = new Ctx();
      const tones = [880, 660, 880];
      tones.forEach((freq, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.frequency.value = freq;
        o.type = 'triangle';
        o.connect(g); g.connect(ac.destination);
        const t0 = ac.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.start(t0); o.stop(t0 + 0.18);
      });
      setTimeout(() => ac.close(), 1200);
    } catch (e) {}
  }

  function showAddError(msg) {
    addError.textContent = msg;
    if (msg) setTimeout(() => { if (addError.textContent === msg) addError.textContent = ''; }, 2500);
  }

  function addState(rawName) {
    if (spinning) return;
    const name = rawName.trim().replace(/\s+/g, ' ');
    if (!name) { showAddError('Enter a name to add.'); return; }
    const exists = allStates.some(s => s.toLowerCase() === name.toLowerCase());
    if (exists) { showAddError(`"${name}" is already on the wheel.`); return; }
    allStates.push(name);
    remaining.push(name);
    addInput.value = '';
    addError.textContent = '';
    drawWheel();
    renderPanel();
  }

  spinBtn.addEventListener('click', spin);
  resetBtn.addEventListener('click', reset);
  addForm.addEventListener('submit', e => {
    e.preventDefault();
    addState(addInput.value);
  });
  timerStartBtn.addEventListener('click', startTimer);
  timerPauseBtn.addEventListener('click', pauseTimer);
  timerResetBtn.addEventListener('click', resetTimer);
  timerInput.addEventListener('change', () => {
    if (!timerInterval) {
      timerSeconds = readTimerInput();
      timerRemaining = timerSeconds;
      renderTimer();
    }
  });
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); spin(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); }
  });

  resizeCanvas();
  resetTimer();
  renderPanel();
})();
</script>
</body>
</html>
